# Apply supabase/migrations/*.sql automatically on every merge to main.
#
# Uses the Supabase Management API (the same endpoint as the dashboard SQL
# editor), so no CLI link or DB password is needed. A _applied_migrations
# table tracks what has run, so each file is applied exactly once. All
# existing migrations are replay-safe (if not exists / or replace), which
# lets the first run backfill the history harmlessly.
#
# One-time setup: repo Settings -> Secrets and variables -> Actions ->
#   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)

name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: lnaszistlucibbrcjewi
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          run_sql() {
            jq -n --arg q "$1" '{query: $q}' \
              | curl -sf -X POST "$API" \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d @-
          }

          run_sql "create table if not exists _applied_migrations (
            filename text primary key,
            applied_at timestamptz not null default now()
          );" > /dev/null

          for f in supabase/migrations/*.sql; do
            name="$(basename "$f")"
            applied="$(run_sql "select 1 from _applied_migrations where filename = '${name}';")"
            if [ "$applied" != "[]" ]; then
              echo "::notice::skip ${name} (already applied)"
              continue
            fi
            echo "applying ${name}"
            run_sql "$(cat "$f")" > /dev/null
            run_sql "insert into _applied_migrations (filename) values ('${name}');" > /dev/null
            echo "::notice::applied ${name}"
          done
