# Apply supabase/migrations/*.sql automatically on every merge to main.
#
# Uses the Supabase Management API (the same endpoint as the dashboard SQL
# editor), so no CLI link or DB password is needed. A _applied_migrations
# table tracks what has run, so each file is applied exactly once.
#
# NOTE: the migrations are NOT replay-safe (0001 defines claim_update as
# boolean, 0003 redefines it as text; 0003 also mutates rows). A database
# that was migrated by hand before this workflow existed is therefore
# detected via a marker from the newest hand-applied migration and its
# history is backfilled without re-running anything.
#
# One-time setup: repo Settings -> Secrets and variables -> Actions ->
#   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)

name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: lnaszistlucibbrcjewi
      # Migrations that were applied by hand before this workflow existed.
      # If _applied_migrations is empty and BACKFILL_MARKER exists in the
      # database, these are recorded as applied instead of being re-run.
      BACKFILL_MARKER: "admin_analytics()"
      BACKFILL_FILES: "0001_init.sql 0002_catalog.sql 0003_durable_payments.sql 0004_admin.sql 0005_admin_analytics.sql"
    steps:
      - uses: actions/checkout@v5

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          API="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          # run_sql <label> <sql>: prints the JSON result. On an HTTP error it
          # prints the status and the API's error body (which carries the real
          # Postgres message) and fails the job instead of a bare curl exit 22.
          run_sql() {
            local label="$1" sql="$2" body status
            body="$(mktemp)"
            status="$(jq -n --arg q "$sql" '{query: $q}' \
              | curl -s -o "$body" -w '%{http_code}' -X POST "$API" \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d @-)"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::${label}: Supabase API returned HTTP ${status}"
              cat "$body"; echo
              rm -f "$body"
              return 1
            fi
            cat "$body"
            rm -f "$body"
          }

          run_sql "bootstrap" "create table if not exists _applied_migrations (
            filename text primary key,
            applied_at timestamptz not null default now()
          );" > /dev/null

          # First run against a database that was migrated by hand: backfill.
          history_count="$(run_sql "count history" "select count(*)::int as n from _applied_migrations;" | jq -r '.[0].n')"
          if [ "$history_count" = "0" ]; then
            marker="$(run_sql "probe marker" "select to_regprocedure('${BACKFILL_MARKER}') is not null as present;" | jq -r '.[0].present')"
            if [ "$marker" = "true" ]; then
              values=""
              for name in $BACKFILL_FILES; do
                values="${values:+${values},}('${name}')"
              done
              run_sql "backfill" "insert into _applied_migrations (filename) values ${values} on conflict do nothing;" > /dev/null
              echo "::notice::backfilled history for hand-applied migrations: ${BACKFILL_FILES}"
            fi
          fi

          for f in supabase/migrations/*.sql; do
            name="$(basename "$f")"
            applied="$(run_sql "check ${name}" "select 1 from _applied_migrations where filename = '${name}';")"
            if [ "$applied" != "[]" ]; then
              echo "::notice::skip ${name} (already applied)"
              continue
            fi
            echo "applying ${name}"
            run_sql "apply ${name}" "$(cat "$f")" > /dev/null
            run_sql "record ${name}" "insert into _applied_migrations (filename) values ('${name}');" > /dev/null
            echo "::notice::applied ${name}"
          done
