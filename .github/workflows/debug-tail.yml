name: Debug tail (temporary)

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check webhook status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "== getWebhookInfo =="
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"
          echo
      - name: Tail worker logs
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i wrangler@4.132.0 --no-save >/dev/null 2>&1
          (timeout 55 npx wrangler tail --format json > tail.jsonl 2>&1) &
          sleep 20
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"update_id":999999001,"message":{"message_id":1,"from":{"id":12345},"chat":{"id":12345},"text":"/start"}}' \
            "https://digital-shelf-bot.work-simo-space.workers.dev/webhook/${WEBHOOK_SECRET}" || true
          sleep 25
          echo "===== TAIL ====="
          head -c 6000 tail.jsonl || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
