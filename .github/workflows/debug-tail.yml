name: Debug tail (temporary)

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tail worker logs while hitting /health
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i wrangler@4.132.0 --no-save >/dev/null 2>&1
          (timeout 70 npx wrangler tail --format json > tail.jsonl 2>&1) &
          sleep 20
          for i in 1 2 3; do
            curl -s -o /dev/null -w "health attempt $i: %{http_code}\n" https://digital-shelf-bot.work-simo-space.workers.dev/health
            sleep 2
          done
          sleep 40
          echo "===== TAIL OUTPUT ====="
          cat tail.jsonl || true
