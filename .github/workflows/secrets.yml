name: Sync Worker secrets

# Run manually (Actions tab -> "Sync Worker secrets" -> Run workflow) whenever
# you add or rotate a GitHub secret/variable. Values go straight from GitHub to
# Cloudflare Worker secrets; they never appear in logs or the repository.
#
# TERMS_TEXT and PRIVACY_TEXT are public legal copy, not credentials: they are
# read from repository *Variables* first (Settings -> Secrets and variables ->
# Actions -> Variables), falling back to Secrets for backward compatibility.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push secrets to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STOCK_FERNET_KEY: ${{ secrets.STOCK_FERNET_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TERMS_TEXT: ${{ vars.TERMS_TEXT || secrets.TERMS_TEXT }}
          PRIVACY_TEXT: ${{ vars.PRIVACY_TEXT || secrets.PRIVACY_TEXT }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN SUPABASE_SERVICE_ROLE_KEY STOCK_FERNET_KEY \
                        WEBHOOK_SECRET TERMS_TEXT PRIVACY_TEXT ADMIN_IDS; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::warning::Value for $name is empty - skipped"
              continue
            fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          done
