name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: telegram_shop
          POSTGRES_USER: telegram_shop
          POSTGRES_PASSWORD: telegram_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telegram_shop -d telegram_shop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SHOP_ENVIRONMENT: test
      SHOP_DATABASE_URL: postgresql+asyncpg://telegram_shop:telegram_shop@127.0.0.1:5432/telegram_shop
      SHOP_TEST_DATABASE_URL: postgresql+asyncpg://telegram_shop:telegram_shop@127.0.0.1:5432/telegram_shop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --frozen --group dev

      - name: Apply canonical migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check shop tests worker/src tools scripts src migrations

      - name: Type check canonical application
        run: uv run mypy src/digital_shelf

      - name: Test suite (includes real-WebCrypto Fernet regression tests)
        run: uv run python -m pytest -q

      - name: Worker syntax check
        run: python -m py_compile worker/src/*.py

      - name: Dashboard JS syntax check
        run: node --check dashboard/app.js

      - name: Build canonical container
        run: docker build --tag digital-shelf:${{ github.sha }} .

  deploy:
    name: Deploy Worker to Cloudflare
    # Only a trusted main-branch push whose own checks passed may deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.132.0"
          command: deploy

  deploy-dashboard:
    name: Deploy dashboard to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Generate public dashboard config
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" && test -n "$SUPABASE_ANON_KEY"
          cat > dashboard/config.js <<EOF
          const CONFIG = {
            projectRef: "${SUPABASE_PROJECT_REF}",
            anonKey: "${SUPABASE_ANON_KEY}",
            workerUrl: "https://digital-shelf-bot.work-simo-space.workers.dev",
          };
          EOF

      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dashboard
          wranglerVersion: "4.132.0"
          command: pages project create digital-shelf-admin --production-branch=main
        continue-on-error: true  # fails harmlessly when the project exists

      - name: Deploy dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dashboard
          wranglerVersion: "4.132.0"
          command: pages deploy . --project-name=digital-shelf-admin
