services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telegram_shop
      POSTGRES_USER: telegram_shop
      POSTGRES_PASSWORD: telegram_shop
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram_shop -d telegram_shop"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - canonical_postgres:/var/lib/postgresql/data

volumes:
  canonical_postgres:
