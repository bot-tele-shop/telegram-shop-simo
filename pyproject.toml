[project]
name = "digital-shelf-telegram"
version = "0.2.0"
description = "A Telegram Stars shop with encrypted inventory and durable Canboso fulfillment"
requires-python = ">=3.11,<3.15"
dependencies = ["aiogram==3.31.0", "cryptography>=46,<49"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
