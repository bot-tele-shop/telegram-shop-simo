[project]
name = "digital-shelf-telegram"
version = "0.3.0"
description = "A Telegram digital-products shop with encrypted inventory and durable fulfillment"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram==3.31.0",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "cryptography==48.0.1",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "uvicorn==0.53.0",
]

[project.scripts]
digital-shelf-worker = "digital_shelf.worker:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_shelf"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a real PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/digital_shelf"]
